server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirigir dominio sin www al canónico
    if ($host = opticamilap.com) {
        return 301 https://www.opticamilap.com$request_uri;
    }

    # URLs limpias: /index.html y /ruta.html redirigen a / y /ruta
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        if ($request_uri ~ \.html) {
            return 301 /$1;
        }
    }

    # Rutas pre-renderizadas (/servicios -> servicios.html); lo demás es 404 real
    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block sensitive paths
    location ~* /(\.env|\.git|\.htaccess|wp-login\.php|wp-admin|xmlrpc\.php) {
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
