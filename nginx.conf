server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml image/x-icon;
    gzip_vary on;
    gzip_min_length 1000;

    # Caché vía `expires` (no add_header, que anularía los security headers del server)
    # Assets con hash en el nombre (Vite): 1 año
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Otros estáticos de /public (favicon, og-image...): 1 semana
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?|ttf|xml|txt)$ {
        expires 7d;
    }

    # Redirigir dominio sin www al canónico
    if ($host = opticamilap.com) {
        return 301 https://www.opticamilap.com$request_uri;
    }

    # URLs limpias: /index.html y /ruta.html redirigen a / y /ruta
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        if ($request_uri ~ \.html) {
            return 301 /$1;
        }
    }

    # Rutas pre-renderizadas (/servicios -> servicios.html); lo demás es 404 real
    location / {
        expires -1;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block sensitive paths
    location ~* /(\.env|\.git|\.htaccess|wp-login\.php|wp-admin|xmlrpc\.php) {
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
